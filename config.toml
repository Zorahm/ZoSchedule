# Конфигурация ZoSchedule.
# Номер группы и время постов живут здесь, а не в коде. Секреты — в .env.

[group]
# Название группы ровно как на сайте колледжа.
# Сверяется без учёта регистра и вида тире, так что "ОККИПд-307" и
# "оккипд‑307" эквивалентны.
name = "ОККИПд-307"

[poll]
# Раз в час: расписание меняется редко, чаще дёргать сайт незачем.
interval_minutes = 60

[bot]
# Telegram-бот: неделя по воскресеньям (в закреп), «Сегодня» каждое утро,
# изменения расписания отдельными текстовыми сообщениями.
# Токен бота: ZOSCHEDULE_BOT_TOKEN в .env. Чат бот узнаёт из команды /go.
today_at = "07:00"      # время «Сегодня», московское
# Слать дневную картинку накануне: как только закончилась последняя пара дня, бот
# удаляет картинку этого дня и присылает завтрашнюю с подписью «Завтра». В полночь она
# сама переименовывается в «Сегодня» (правится на месте, без нового сообщения).
# В дни без пар (воскресенье) завтрашний день уходит в today_at.
day_ahead = false
week_at = "07:00"       # время недели в воскресенье, московское
pin_week = true
# Слать сообщения без звука (неделя, «Сегодня», изменения): уведомление приходит,
# но не звенит. Закреп и ответы на /go всегда тихие. Правка картинок не уведомляет.
silent = false
# Кто может управлять ботом: Telegram-id людей (числа, не ники). Только они могут
# написать /go и добавить бота в группу; остальные игнорируются, а из группы, куда бота
# добавил чужой, он сразу выходит. Бот помнит одну группу: /go доверенного в другой
# группе переносит его туда. Свой id покажет @userinfobot. Пусто: /go не примет никто.
# На сервере удобнее .env: ZOSCHEDULE_BOT_TRUSTED_USERS=123456789,987654321
trusted_users = []
# Опрашивать сайт самому ботом (раз в poll.interval_minutes). Выключайте только
# на демо-базе, иначе демо-данные заменятся ответом настоящего сайта.
refresh = true
# Путь к Chrome/Edge для рендера картинок. Пусто — ищем установленный в системе,
# затем bundled Chromium от Playwright.
# browser_path = "C:/Program Files/Google/Chrome/Application/chrome.exe"
